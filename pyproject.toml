[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "li-crawler"
version = "0.1.0"
description = "LinkedIn organisation crawler - hexagonal architecture (Playwright + BeautifulSoup/lxml)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
li-crawler = "li_crawler.adapters.inbound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
